; et.cfg : Config file for Eternal Terminal
;

[Networking]
port = 2022
# bind_ip = 0.0.0.0
# Depth of the kernel accept queue (the listen(2) backlog). Raise it if many
# clients reconnect at once. Linux truncates this to net.core.somaxconn.
# backlog = 128

[Debug]
verbose = 0
silent = 0
logsize = 20971520
telemetry = true
logdirectory = /tmp
