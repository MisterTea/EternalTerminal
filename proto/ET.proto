syntax = "proto2";
package et;
option optimize_for = LITE_RUNTIME;

enum EtPacketType {
  // Count down from 254 to avoid collisions
  HEARTBEAT = 254;
  INITIAL_PAYLOAD = 253;
  INITIAL_RESPONSE = 252;
}

message ConnectRequest {
  optional string clientId = 1;
  optional int32 version = 2;
}

enum ConnectStatus {
  NEW_CLIENT = 1;
  RETURNING_CLIENT = 2;
  INVALID_KEY = 3;
  MISMATCHED_PROTOCOL = 4;
}

message ConnectResponse {
  optional ConnectStatus status = 1;
  optional string error = 2;
  // How many packets this side has already sent on the session's outbound
  // stream. Only meaningful with RETURNING_CLIENT, and only used by a client
  // that is adopting a session a previous process left behind: it has received
  // none of them, so without this it would ask for the whole session to be
  // replayed, including the setup packets its run loop is long past. Adopting
  // the count makes the client "already caught up" and the replay empty. An
  // older server leaves it unset, which reads as 0 and preserves the old
  // (full-replay) behavior.
  optional int64 writeSequenceNumber = 3;
}

message SequenceHeader {
  optional int32 sequenceNumber = 1;
}

message CatchupBuffer {
  repeated bytes buffer = 1;
}

message SocketEndpoint {
  optional string name = 1;
  optional int32 port = 2;
}
