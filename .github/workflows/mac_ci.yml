name: Mac CI

on:
  push:
    branches:
      - master
  pull_request:

# Keep only the latest commit of each PR; push runs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ubsan:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Indicates the CMake build directory where project files and binaries are being produced.
      CMAKE_BUILD_DIR: ${{ github.workspace }}/build
      # Indicates the location of the vcpkg as a Git submodule of the project repository.
      VCPKG_ROOT: ${{ github.workspace }}/external/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        shell: bash
        run: |
          mkdir -p ~/.ssh/
          echo -e "Host github.com\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config
          brew install ccache cmake ninja; brew install protobuf libsodium automake autoconf autoconf-archive libtool
          git submodule sync --recursive
          git submodule update --init --force --recursive

      # Restore both vcpkg and its artifacts from the GitHub cache service.
      - name: Restore project compiler cache
        uses: ./.github/actions/ccache
        with:
          key: sanitize-${{ runner.os }}-${{ github.job }}

      - name: Restore shared dependency archives
        uses: ./.github/actions/vcpkg-cache

      - name: Ensure vcpkg binary cache directory
        shell: bash
        run: mkdir -p "${{ github.workspace }}/.vcpkg-binary-cache"


      - name: Test with ubsan
        run: |
          parallel_level="${CI_PARALLEL_LEVEL:-2}"
          if [[ -n "${ACT:-}" ]]; then
            parallel_level="${CI_PARALLEL_LEVEL:-14}"
          fi
          mkdir -p build
          pushd build
          cmake -DDISABLE_TELEMETRY=ON -DSANITIZE_UNDEFINED=ON ../
          cmake --build . --parallel "${parallel_level}"
          TSAN_OPTIONS="suppressions=../test/test_tsan.suppression" ctest --parallel "${parallel_level}" --timeout 300 --output-on-failure
          popd

  asan:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Indicates the CMake build directory where project files and binaries are being produced.
      CMAKE_BUILD_DIR: ${{ github.workspace }}/build
      # Indicates the location of the vcpkg as a Git submodule of the project repository.
      VCPKG_ROOT: ${{ github.workspace }}/external/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive
          mkdir -p ~/.ssh/
          echo -e "Host github.com\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config
          brew install ccache cmake ninja; brew install protobuf libsodium automake autoconf autoconf-archive libtool

      # Restore both vcpkg and its artifacts from the GitHub cache service.
      - name: Restore project compiler cache
        uses: ./.github/actions/ccache
        with:
          key: sanitize-${{ runner.os }}-${{ github.job }}

      - name: Restore shared dependency archives
        uses: ./.github/actions/vcpkg-cache

      - name: Ensure vcpkg binary cache directory
        shell: bash
        run: mkdir -p "${{ github.workspace }}/.vcpkg-binary-cache"


      - name: Test with asan
        run: |
          parallel_level="${CI_PARALLEL_LEVEL:-2}"
          if [[ -n "${ACT:-}" ]]; then
            parallel_level="${CI_PARALLEL_LEVEL:-14}"
          fi
          mkdir -p build
          pushd build
          cmake -DDISABLE_TELEMETRY=ON -DSANITIZE_ADDRESS=ON ../
          cmake --build . --parallel "${parallel_level}"
          TSAN_OPTIONS="suppressions=../test/test_tsan.suppression" ctest --parallel "${parallel_level}" --timeout 300 --output-on-failure
          popd

  tsan:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Indicates the CMake build directory where project files and binaries are being produced.
      CMAKE_BUILD_DIR: ${{ github.workspace }}/build
      # Indicates the location of the vcpkg as a Git submodule of the project repository.
      VCPKG_ROOT: ${{ github.workspace }}/external/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive
          mkdir -p ~/.ssh/
          echo -e "Host github.com\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config
          brew install ccache cmake ninja; brew install protobuf libsodium automake autoconf autoconf-archive libtool

      # Restore both vcpkg and its artifacts from the GitHub cache service.
      - name: Restore project compiler cache
        uses: ./.github/actions/ccache
        with:
          key: sanitize-${{ runner.os }}-${{ github.job }}

      - name: Restore shared dependency archives
        uses: ./.github/actions/vcpkg-cache

      - name: Ensure vcpkg binary cache directory
        shell: bash
        run: mkdir -p "${{ github.workspace }}/.vcpkg-binary-cache"


      - name: Test with tsan
        run: |
          parallel_level="${CI_PARALLEL_LEVEL:-2}"
          if [[ -n "${ACT:-}" ]]; then
            parallel_level="${CI_PARALLEL_LEVEL:-14}"
          fi
          mkdir -p build
          pushd build
          cmake -DDISABLE_TELEMETRY=ON -DSANITIZE_THREAD=ON -DSANITIZE_LINK_STATIC=ON ../
          cmake --build . --parallel "${parallel_level}"
          TSAN_OPTIONS="suppressions=../test/test_tsan.suppression:die_after_fork=0:report_thread_leaks=0" ctest --parallel "${parallel_level}" --timeout 300 --output-on-failure
          popd
