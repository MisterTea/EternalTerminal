name: Portability CI

on:
  push:
    branches:
      - master
      - release
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  linux_distros:
    name: build-${{ matrix.distro }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.container }}
      options: --privileged
    env:
      SHELL: /bin/bash
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - distro: debian
            container: debian:stable
            install: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                autoconf \
                automake \
                build-essential \
                ca-certificates \
                cmake \
                curl \
                debhelper \
                git \
                libcurl4-openssl-dev \
                libprotobuf-dev \
                libsodium-dev \
                libssl-dev \
                libtool \
                libunwind-dev \
                libutempter-dev \
                ninja-build \
                pkg-config \
                procps \
                protobuf-compiler \
                tar \
                unzip \
                zip
          - distro: fedora
            container: fedora:latest
            install: |
              dnf install -y \
                @development-tools \
                ca-certificates \
                cmake \
                curl \
                gcc \
                gcc-c++ \
                git \
                libatomic \
                libcurl-devel \
                libsodium-devel \
                libunwind-devel \
                ninja-build \
                openssl-devel \
                pkgconf-pkg-config \
                protobuf-compiler \
                protobuf-devel \
                procps-ng \
                tar \
                unzip \
                zip
          - distro: rocky-linux
            container: rockylinux:9
            install: |
              dnf install -y dnf-plugins-core epel-release
              dnf config-manager --set-enabled crb
              dnf install -y \
                autoconf \
                automake \
                boost-devel \
                ca-certificates \
                cmake \
                curl-devel \
                gcc \
                gcc-c++ \
                git \
                gflags-devel \
                libatomic \
                libsodium-devel \
                libtool \
                libunwind-devel \
                libutempter-devel \
                ninja-build \
                openssl-devel \
                pkgconf-pkg-config \
                procps-ng \
                protobuf-compiler \
                protobuf-devel \
                tar \
                unzip \
                zip
          - distro: gentoo
            container: gentoo/stage3:latest
            install: |
              mkdir -p /etc/portage /var/cache/binpkgs /var/cache/distfiles
              if [ -f /etc/portage/make.conf ]; then
                printf '%s\n' 'FEATURES="${FEATURES} buildpkg"' 'EMERGE_DEFAULT_OPTS="${EMERGE_DEFAULT_OPTS} --usepkg=y"' >> /etc/portage/make.conf
              fi
              if [ ! -f /var/db/repos/gentoo/profiles/repo_name ]; then
                emerge-webrsync
              fi
              emerge --jobs=2 \
                dev-build/autoconf \
                dev-build/automake \
                dev-build/cmake \
                dev-build/libtool \
                dev-build/ninja \
                dev-libs/boost \
                dev-libs/libsodium \
                dev-libs/openssl \
                dev-libs/protobuf \
                dev-libs/userspace-rcu \
                dev-util/pkgconf \
                dev-vcs/git \
                net-misc/curl \
                sys-libs/libunwind \
                sys-libs/libutempter \
                sys-process/procps
          - distro: archlinux
            container: archlinux:latest
            install: |
              pacman -Syu --disable-sandbox --noconfirm --needed \
                autoconf \
                automake \
                base-devel \
                ca-certificates \
                cmake \
                curl \
                git \
                jq \
                libtool \
                libunwind \
                libutempter \
                libsodium \
                namcap \
                ninja \
                openssh \
                openssl \
                pkgconf \
                protobuf \
                procps-ng \
                tar \
                unzip \
                zip
          - distro: opensuse
            container: opensuse/tumbleweed:latest
            install: |
              zypper --non-interactive install --no-recommends \
                autoconf \
                automake \
                binutils \
                ca-certificates \
                cmake \
                curl \
                gcc \
                gcc-c++ \
                git \
                gzip \
                libcurl-devel \
                libopenssl-devel \
                libsodium-devel \
                libtool \
                libunwind-devel \
                ninja \
                pkgconf \
                procps \
                protobuf-devel \
                /usr/bin/python3 \
                tar \
                unzip \
                zip
    steps:
      - name: Restore Gentoo package cache
        if: matrix.distro == 'gentoo'
        uses: actions/cache@v5
        with:
          path: |
            /var/cache/distfiles
            /var/cache/binpkgs
            /var/db/repos/gentoo
          key: gentoo-packages-${{ github.sha }}
          restore-keys: |
            gentoo-packages-

      - name: Install dependencies
        shell: bash
        run: ${{ matrix.install }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate project files
        shell: bash
        run: |
          cmake_build_dir="${GITHUB_WORKSPACE}/build"
          cmake -DDISABLE_TELEMETRY=ON -DDISABLE_VCPKG=ON -S "${GITHUB_WORKSPACE}" -B "${cmake_build_dir}" -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build and test
        shell: bash
        run: |
          cmake_build_dir="${GITHUB_WORKSPACE}/build"
          parallel_level="${CI_PARALLEL_LEVEL:-4}"
          cmake --build "${cmake_build_dir}" --parallel "${parallel_level}"
          ctest --test-dir "${cmake_build_dir}" --parallel "${parallel_level}" --output-on-failure

  freebsd:
    name: build-freebsd
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_DIR: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore FreeBSD packages
        uses: actions/cache@v5
        with:
          path: |
            .ci-cache/pkg
          key: freebsd-build-${{ github.sha }}
          restore-keys: |
            freebsd-build-

      - name: Install act QEMU dependencies
        if: ${{ env.ACT }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-efi-aarch64 \
            qemu-system-arm \
            rsync
          sudo rm -rf /root/work
          sudo ln -s "${GITHUB_WORKSPACE}" /root/work
          sudo mkdir -p /home/runner/work/EternalTerminal
          sudo rsync -a --delete \
            --exclude build \
            "${GITHUB_WORKSPACE}/" \
            /home/runner/work/EternalTerminal/EternalTerminal/

      - name: Start FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          arch: ${{ env.ACT && 'aarch64' || '' }}
          usesh: true

      - name: Expose FreeBSD shell for act
        if: ${{ env.ACT }}
        shell: bash
        run: |
          sudo ln -sf "${HOME}/.local/bin/freebsd" /usr/local/bin/freebsd

      - name: Build and test on FreeBSD
        shell: freebsd {0}
        run: |
          if [ -f /root/work/CMakeLists.txt ]; then
            cd /root/work
          elif [ -f /home/runner/work/EternalTerminal/EternalTerminal/CMakeLists.txt ]; then
            cd /home/runner/work/EternalTerminal/EternalTerminal
          else
            cd "${GITHUB_WORKSPACE}"
          fi

          mkdir -p "$(pwd)/.ci-cache/pkg"
          export PKG_CACHEDIR="$(pwd)/.ci-cache/pkg"

          pkg install -y \
            autoconf \
            automake \
            ca_root_nss \
            cmake \
            curl \
            git \
            libtool \
            libunwind \
            libsodium \
            ninja \
            openssl \
            protobuf \
            unzip \
            zip

          cmake -DDISABLE_TELEMETRY=ON -DDISABLE_VCPKG=ON -DOPENSSL_ROOT_DIR=/usr/local -DCMAKE_PREFIX_PATH=/usr/local -S "$(pwd)" -B "$(pwd)/build" -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          parallel_level="${CI_PARALLEL_LEVEL:-4}"
          cmake --build "$(pwd)/build" --parallel "${parallel_level}"
          export SHELL=/bin/sh
          ctest_status=0
          ctest --test-dir "$(pwd)/build" --parallel "${parallel_level}" --output-on-failure || ctest_status=$?
          # vmactions copies the workspace back after this script. The
          # RelWithDebInfo tree is several gigabytes and that rsync fails
          # after a green test run.
          rm -rf "$(pwd)/build"
          exit "${ctest_status}"

  openwrt:
    name: build-openwrt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore OpenWrt SDK cache
        uses: actions/cache@v5
        with:
          path: .openwrt-cache
          key: openwrt-sdk-x86-64-23.05.5-${{ hashFiles('openwrt/**') }}-${{ github.sha }}
          restore-keys: |
            openwrt-sdk-x86-64-23.05.5-${{ hashFiles('openwrt/**') }}-
            openwrt-sdk-x86-64-23.05.5-

      - name: Build OpenWrt package with SDK
        shell: bash
        run: |
          mkdir -p bin/openwrt .openwrt-cache && chmod 777 bin/openwrt .openwrt-cache
          docker run --rm \
            --platform linux/amd64 \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${GITHUB_WORKSPACE}/.openwrt-cache:/owrt-cache" \
            openwrt/sdk:x86-64-23.05.5 \
            bash -c '
              set -euo pipefail
              sdk_root=$(pwd)
              mkdir -p /owrt-cache/dl /owrt-cache/feeds /owrt-cache/build_dir
              adopt_cache() {
                local name="$1"
                if [ -n "$(ls -A "/owrt-cache/${name}" 2>/dev/null || true)" ]; then
                  rm -rf "${sdk_root}/${name}"
                  ln -s "/owrt-cache/${name}" "${sdk_root}/${name}"
                fi
              }
              persist_cache() {
                local name="$1"
                if [ ! -L "${sdk_root}/${name}" ] && [ -d "${sdk_root}/${name}" ]; then
                  mkdir -p "/owrt-cache/${name}"
                  cp -a "${sdk_root}/${name}/." "/owrt-cache/${name}/"
                fi
              }
              adopt_cache dl
              adopt_cache feeds
              adopt_cache build_dir
              sed \
                -e "s,https://git.openwrt.org/feed/,https://github.com/openwrt/," \
                -e "s,https://git.openwrt.org/openwrt/,https://github.com/openwrt/," \
                -e "s,https://git.openwrt.org/project/,https://github.com/openwrt/," \
                feeds.conf.default > feeds.conf
              ./scripts/feeds update base packages
              ./scripts/feeds install libsodium protobuf zlib libopenssl libunwind
              rm -rf package/eternalterminal
              cp -r /workspace/openwrt package/eternalterminal
              make defconfig
              echo "CONFIG_PACKAGE_eternalterminal=y" >> .config
              make defconfig
              parallel_level="${CI_PARALLEL_LEVEL:-$(nproc)}"
              make package/eternalterminal/compile V=s -j"${parallel_level}" ET_SRC_DIR=/workspace
              mkdir -p /workspace/bin/openwrt
              find bin -name "eternalterminal*.ipk" -exec cp -v {} /workspace/bin/openwrt/ \;
              persist_cache dl
              persist_cache feeds
              persist_cache build_dir
            '

      - name: Test OpenWrt package in target rootfs
        shell: bash
        run: |
          docker run --rm \
            --platform linux/amd64 \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            openwrt/rootfs:x86-64-23.05.5 \
            sh -c '
              set -eu
              mkdir -p /var/lock
              opkg update
              opkg install libsodium protobuf libopenssl zlib libstdcpp libunwind8 python3
              ipk=$(find /workspace/bin/openwrt -name "eternalterminal*.ipk" | head -n 1)
              if [ -z "$ipk" ]; then
                echo "Error: No eternalterminal IPK found in /workspace/bin/openwrt"
                exit 1
              fi
              echo "Installing $ipk..."
              opkg install "$ipk"
              echo "Verifying installed files..."
              test -x /usr/bin/et
              test -x /usr/bin/etserver
              test -x /usr/bin/etterminal
              test -x /etc/init.d/etserver
              echo "Verifying et help output..."
              /usr/bin/et --help || true
              echo "Verifying etserver help output..."
              /usr/bin/etserver --help || true
              if [ -x /usr/bin/et-test ]; then
                echo "Running unit tests with et-test..."
                /usr/bin/et-test "~[.ghostty]"
              fi
              if [ -x /usr/bin/htm ] && [ -x /usr/bin/htmd ]; then
                echo "Running htm e2e tests..."
                python3 /workspace/test/system_tests/htm_pty_e2e.py --htm /usr/bin/htm --htmd /usr/bin/htmd
                python3 /workspace/test/system_tests/htm_features_e2e.py --htm /usr/bin/htm --htmd /usr/bin/htmd
                python3 /workspace/test/system_tests/htm_stress_e2e.py --htm /usr/bin/htm --htmd /usr/bin/htmd
              fi
              echo "OpenWrt package verified successfully!"
            '
