name: Deploy Debian Repo

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy. Leave blank to use the latest GitHub release."
        required: false
        default: ""
      debian_repo:
        description: "Git repository containing the published Debian repo."
        required: true
        default: "git@github.com:MisterTea/debian-et.git"
      push_changes:
        description: "Commit and push generated repository contents."
        required: true
        type: boolean
        default: true
      debian_suites:
        description: "Space-separated Debian suites to build. Leave blank for oldstable, stable, and testing."
        required: false
        default: ""
      debian_arches:
        description: "Space-separated Debian architectures to build. Leave blank for amd64 and arm64."
        required: false
        default: ""
      verbose_build:
        description: "Run debhelper in verbose mode."
        required: true
        type: boolean
        default: true
      quiet_sbuild:
        description: "Redirect sbuild logs to files unless a package build command fails."
        required: true
        type: boolean
        default: false
      deb_build_jobs:
        description: "Parallel jobs passed to Debian package builds."
        required: true
        default: "2"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: resolve-debian-matrix
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Choose suites and architectures
        id: matrix
        env:
          DEBIAN_SUITES: ${{ inputs.debian_suites }}
          DEBIAN_ARCHES: ${{ inputs.debian_arches }}
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            distro-info \
            jq

          if [[ -n "${DEBIAN_SUITES}" ]]; then
            read -r -a debian_suites <<< "${DEBIAN_SUITES}"
          else
            mapfile -t debian_suites < <(
              debian-distro-info --oldstable
              debian-distro-info --stable
              debian-distro-info --testing
            )
          fi
          if [[ -n "${DEBIAN_ARCHES}" ]]; then
            read -r -a debian_arches <<< "${DEBIAN_ARCHES}"
          else
            debian_arches=(amd64 arm64)
          fi
          if [[ "${#debian_suites[@]}" -eq 0 || "${#debian_arches[@]}" -eq 0 ]]; then
            echo "Debian suite or architecture list is empty" >&2
            exit 1
          fi

          include="[]"
          for suite in "${debian_suites[@]}"; do
            for arch in "${debian_arches[@]}"; do
              case "${arch}" in
                amd64) runner="ubuntu-latest" ;;
                # Native arm64 avoids multi-hour QEMU builds on amd64 runners.
                arm64) runner="ubuntu-24.04-arm" ;;
                *) runner="ubuntu-latest" ;;
              esac
              include="$(jq --compact-output \
                --arg suite "${suite}" \
                --arg arch "${arch}" \
                --arg runner "${runner}" \
                '. + [{suite: $suite, arch: $arch, runner: $runner}]' <<<"${include}")"
            done
          done
          matrix="$(jq --compact-output --argjson include "${include}" '{include: $include}' <<<'{}')"
          echo "Debian build matrix: ${matrix}"
          {
            echo "matrix<<EOF"
            echo "${matrix}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: build-${{ matrix.suite }}-${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:stable
      options: --privileged
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    env:
      DEBFULLNAME: Jason Gauci
      DEBEMAIL: jgmath2000@gmail.com
      DEBIAN_REPO: ${{ inputs.debian_repo }}
      DEBIAN_ARCHES: ${{ matrix.arch }}
      DEBIAN_SUITES: ${{ matrix.suite }}
      DEB_BUILD_JOBS: ${{ inputs.deb_build_jobs }}
      INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
      QUIET_SBUILD: ${{ inputs.quiet_sbuild }}
      VERBOSE_BUILD: ${{ inputs.verbose_build }}
    steps:
      - name: Install build and publishing dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            aptly \
            arch-test \
            binfmt-support \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            debhelper \
            debian-archive-keyring \
            debootstrap \
            devscripts \
            distro-info \
            git \
            gnupg \
            iproute2 \
            jq \
            libcurl4-openssl-dev \
            libprotobuf-dev \
            libsodium-dev \
            libssl-dev \
            libtool \
            libunwind-dev \
            libutempter-dev \
            mmdebstrap \
            ninja-build \
            openssh-client \
            protobuf-compiler \
            python3 \
            qemu-user-binfmt \
            qemu-user-static \
            rsync \
            sbuild \
            uidmap \
            wget \
            zstd

          update-binfmts --enable || true
          [[ -e /dev/console ]] || mknod -m 600 /dev/console c 5 1 || true
          install -d "${HOME}/.cache/sbuild" "${HOME}/.config/sbuild"

          if ! awk -F: '$1 == "root" { found = 1 } END { exit !found }' /etc/subuid; then
            echo "root:100000:65536" >> /etc/subuid
          fi
          if ! awk -F: '$1 == "root" { found = 1 } END { exit !found }' /etc/subgid; then
            echo "root:100000:65536" >> /etc/subgid
          fi

          cat > "${HOME}/.config/sbuild/config.pl" <<'EOF'
          $chroot_mode = "unshare";
          $run_lintian = 0;
          1;
          EOF

      - name: Resolve release
        run: |
          if [[ -n "${INPUT_RELEASE_TAG}" ]]; then
            release_tag="${INPUT_RELEASE_TAG}"
            tarball_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${release_tag}"
          else
            latest_release="$(curl --fail --silent --show-error --location "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest")"
            release_tag="$(jq --raw-output ".tag_name" <<<"${latest_release}")"
            tarball_url="$(jq --raw-output ".tarball_url" <<<"${latest_release}")"
          fi

          if [[ -z "${release_tag}" || "${release_tag}" == "null" ]]; then
            echo "Could not resolve a release tag" >&2
            exit 1
          fi

          version="${release_tag#et-v}"
          if [[ "${version}" == "${release_tag}" ]]; then
            echo "Expected release tag to start with et-v, got ${release_tag}" >&2
            exit 1
          fi

          {
            echo "RELEASE_TAG=${release_tag}"
            echo "RELEASE_VERSION=${version}"
            echo "TARBALL_URL=${tarball_url}"
            echo "ORIG_TARBALL=et_${version}.orig.tar.gz"
          } >> "${GITHUB_ENV}"

      - name: Download original release tarball
        run: |
          wget "${TARBALL_URL}" -O "${ORIG_TARBALL}"

      - name: Build Debian packages
        run: |
          debbuildopts="-j${DEB_BUILD_JOBS}"

          run_logged() {
            local log_file="$1"
            shift

            if [[ "${QUIET_SBUILD}" == "true" ]]; then
              echo "Running command; full log: ${log_file}"
              if ! "$@" >"${log_file}" 2>&1; then
                echo "Command failed; matching error lines:" >&2
                awk 'tolower($0) ~ /(error:|fatal:|failed|killed|undefined reference|cannot|no such file|returned exit status)/ { print }' "${log_file}" >&2 || true
                echo "Command failed; last 400 log lines:" >&2
                tail -n 400 "${log_file}" >&2 || true
                return 1
              fi
            else
              "$@"
            fi
          }

          if [[ -n "${DEBIAN_SUITES}" ]]; then
            read -r -a debian_suites <<<"${DEBIAN_SUITES}"
          else
            mapfile -t debian_suites < <(
              {
                debian-distro-info --oldstable
                debian-distro-info --stable
                debian-distro-info --testing
              } | awk 'NF' | sort -u
            )
          fi

          if [[ "${#debian_suites[@]}" -eq 0 ]]; then
            echo "No Debian suites discovered" >&2
            exit 1
          fi

          if [[ -n "${DEBIAN_ARCHES}" ]]; then
            read -r -a debian_arches <<<"${DEBIAN_ARCHES}"
          else
            debian_arches=(amd64 arm64)
          fi

          if [[ "${#debian_arches[@]}" -eq 0 ]]; then
            echo "No Debian architectures configured" >&2
            exit 1
          fi

          debian_mirror="http://deb.debian.org/debian"

          # Succeeds if the binfmt_misc entry is enabled with the F flag.
          binfmt_ready() {
            awk '$1 == "enabled" { enabled = 1 }
                 $1 == "flags:" && $2 ~ /F/ { fixed = 1 }
                 END { exit !(enabled && fixed) }' "$1"
          }

          register_qemu_binfmt() {
            local arch="$1"
            local qemu_target=""
            local magic mask
            local registry_entry

            case "${arch}" in
              amd64)
                qemu_target="x86_64"
                ;;
              arm64)
                qemu_target="aarch64"
                ;;
              armel|armhf)
                qemu_target="arm"
                ;;
              *)
                return 0
                ;;
            esac

            if [[ "$(dpkg --print-architecture)" == "${arch}" ]]; then
              return 0
            fi

            mountpoint -q /proc/sys/fs/binfmt_misc ||
              mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc

            registry_entry="/proc/sys/fs/binfmt_misc/qemu-${qemu_target}"
            if [[ -e "${registry_entry}" ]] && binfmt_ready "${registry_entry}"; then
              return 0
            fi

            # qemu-user-binfmt ships the register string, including the
            # fix-binary interpreter, in /usr/lib/binfmt.d. systemd is not
            # running in this container, so apply that file directly.
            local conf="/usr/lib/binfmt.d/qemu-${qemu_target}.conf"
            if [[ ! -f "${conf}" ]]; then
              echo "Missing ${conf} for ${arch}" >&2
              exit 1
            fi
            if [[ -e "${registry_entry}" ]]; then
              echo -1 > "${registry_entry}" || true
            fi
            cat "${conf}" > /proc/sys/fs/binfmt_misc/register
            if ! binfmt_ready "${registry_entry}"; then
              echo "ERROR: qemu-${qemu_target} binfmt entry is not enabled with F" >&2
              echo "registration file:" >&2
              cat "${conf}" >&2 || true
              echo "kernel entry:" >&2
              cat "${registry_entry}" >&2 || true
              exit 1
            fi
          }

          for distro in "${debian_suites[@]}"; do
            rm -rf EternalTerminal
            mkdir EternalTerminal
            tar -xzf "${ORIG_TARBALL}" --strip-components=1 -C EternalTerminal

            rm -rf EternalTerminal/debian
            cp -a EternalTerminal/deployment/debian_SOURCE EternalTerminal/debian
            python3 -c 'import pathlib; path = pathlib.Path("EternalTerminal/debian/rules"); path.write_text(path.read_text().replace("-DDISABLE_VCPKG:BOOL=ON", "-DDISABLE_VCPKG:BOOL=ON -DDISABLE_TELEMETRY:BOOL=ON"))'
            if [[ "${VERBOSE_BUILD}" != "true" ]]; then
              python3 -c 'import pathlib; path = pathlib.Path("EternalTerminal/debian/rules"); path.write_text(path.read_text().replace("export DH_VERBOSE = 1", "export DH_VERBOSE = 0"))'
            fi
            python3 -c 'import pathlib, sys; path = pathlib.Path("EternalTerminal/debian/changelog"); path.write_text(path.read_text().replace("##DISTRO##", sys.argv[1]))' "${distro}"
            sed -i -E 's/^\* /  * /; s/^-- / -- /' EternalTerminal/debian/changelog
            if ! grep -q noautodbgsym EternalTerminal/debian/rules; then
              printf '\nexport DEB_BUILD_OPTIONS += noautodbgsym\n\noverride_dh_strip:\n\tdh_strip --no-automatic-dbgsym\n' >> EternalTerminal/debian/rules
            fi

            rm -f ./*.dsc ./*.changes ./*.buildinfo ./*.debian.tar.* ./*.upload
            pushd EternalTerminal
            debuild -S -us -uc
            popd

            for arch in "${debian_arches[@]}"; do
              register_qemu_binfmt "${arch}"

              chroot_tarball="${HOME}/.cache/sbuild/${distro}-${arch}-sbuild.tar"
              chroot_dir="${HOME}/sbuild-chroots/${distro}-${arch}"
              result_dir="${PWD}/sbuild-results/${distro}-${arch}"

              if [[ ! -f "${chroot_tarball}" ]]; then
                rm -rf "${chroot_dir}"
                mkdir -p "$(dirname "${chroot_tarball}")" "$(dirname "${chroot_dir}")"
                run_logged "mmdebstrap-${distro}-${arch}.log" \
                  mmdebstrap \
                    --mode=root \
                    --variant=buildd \
                    --architectures="${arch}" \
                    --include=fakeroot,build-essential \
                    --components=main,contrib,non-free,non-free-firmware \
                    --format=tar \
                    "${distro}" \
                    "${chroot_tarball}" \
                    "${debian_mirror}"
              fi

              rm -rf "${result_dir}"
              mkdir -p "${result_dir}"
              if ! run_logged "sbuild-${distro}-${arch}.log" \
                  sbuild \
                  --chroot-mode=unshare \
                  --chroot="${chroot_tarball}" \
                  --dist="${distro}" \
                  --arch="${arch}" \
                  --build-dir="${result_dir}" \
                  --no-run-lintian \
                  --no-run-autopkgtest \
                  --debbuildopts "${debbuildopts}" \
                  ./*.dsc; then
                shopt -s nullglob
                build_logs=("${result_dir}"/*.build)
                shopt -u nullglob
                if [[ "${#build_logs[@]}" -gt 0 ]]; then
                  echo "sbuild failed; build log tail follows:" >&2
                  for build_log in "${build_logs[@]}"; do
                    echo "==> ${build_log} <==" >&2
                    tail -n 400 "${build_log}" >&2 || true
                  done
                fi
                exit 1
              fi

              mkdir -p "debian-packages/${distro}-${arch}"
              package_files=()
              shopt -s nullglob
              package_files+=("${result_dir}"/*.deb)
              cp -a "${result_dir}"/*.buildinfo "debian-packages/${distro}-${arch}/" || true
              cp -a "${result_dir}"/*.changes "debian-packages/${distro}-${arch}/" || true
              shopt -u nullglob

              if [[ "${#package_files[@]}" -eq 0 ]]; then
                echo "No Debian packages found in expected result directory:" >&2
                printf '  %s\n' "${result_dir}" >&2
                exit 1
              fi

              cp -a "${package_files[@]}" "debian-packages/${distro}-${arch}/"
            done
          done

      - name: Upload built Debian packages
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: debian-deb-${{ matrix.suite }}-${{ matrix.arch }}
          path: debian-packages/
          if-no-files-found: error

  publish:
    name: publish-debian-repo
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    timeout-minutes: 30
    env:
      DEBIAN_REPO: ${{ inputs.debian_repo }}
      INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Install publishing dependencies
        if: ${{ env.ACT != 'true' }}
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            aptly \
            ca-certificates \
            curl \
            git \
            gnupg \
            jq \
            openssh-client \
            rsync \
            wget

      - name: Import GPG signing key
        if: ${{ env.ACT != 'true' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ -z "${GPG_PRIVATE_KEY}" ]]; then
            echo "Missing required secret GPG_PRIVATE_KEY" >&2
            exit 1
          fi
          if [[ -z "${GPG_PASSPHRASE}" ]]; then
            echo "Missing required secret GPG_PASSPHRASE" >&2
            exit 1
          fi

          install -d -m 700 "${HOME}/.gnupg"
          {
            echo "use-agent"
            echo "pinentry-mode loopback"
          } > "${HOME}/.gnupg/gpg.conf"
          echo "allow-loopback-pinentry" > "${HOME}/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent || true

          printf '%s\n' "${GPG_PRIVATE_KEY}" | gpg --batch --import
          key_fingerprint="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [[ -z "${key_fingerprint}" ]]; then
            echo "No GPG secret key was imported" >&2
            exit 1
          fi

          passphrase_file="${RUNNER_TEMP}/gpg-passphrase"
          printf '%s' "${GPG_PASSPHRASE}" > "${passphrase_file}"
          chmod 600 "${passphrase_file}"

          printf 'apt repository signing smoke test\n' > "${RUNNER_TEMP}/gpg-smoke-test"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "${passphrase_file}" \
            --local-user "${key_fingerprint}" \
            --detach-sign --armor \
            --output "${RUNNER_TEMP}/gpg-smoke-test.asc" \
            "${RUNNER_TEMP}/gpg-smoke-test"

          public_key_file="${RUNNER_TEMP}/et.gpg"
          gpg --batch --yes --output "${public_key_file}" --export "${key_fingerprint}"

          {
            echo "GPG_KEY_ID=${key_fingerprint}"
            echo "GPG_PASSPHRASE_FILE=${passphrase_file}"
            echo "GPG_PUBLIC_KEY_FILE=${public_key_file}"
          } >> "${GITHUB_ENV}"

      - name: Resolve release
        if: ${{ env.ACT != 'true' }}
        run: |
          if [[ -n "${INPUT_RELEASE_TAG}" ]]; then
            release_tag="${INPUT_RELEASE_TAG}"
          else
            latest_release="$(curl --fail --silent --show-error --location "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest")"
            release_tag="$(jq --raw-output ".tag_name" <<<"${latest_release}")"
          fi
          if [[ -z "${release_tag}" || "${release_tag}" == "null" ]]; then
            echo "Could not resolve a release tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"

      - name: Download built packages
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v4
        with:
          pattern: debian-deb-*
          path: incoming

      - name: Publish local repositories
        if: ${{ env.ACT != 'true' }}
        run: |
          mapfile -t deb_files < <(find incoming -type f -name '*.deb' | sort)
          if [[ "${#deb_files[@]}" -eq 0 ]]; then
            echo "No Debian packages were downloaded" >&2
            exit 1
          fi

          declare -A suites_seen
          for deb in "${deb_files[@]}"; do
            parent="$(basename "$(dirname "${deb}")")"
            if [[ "${parent}" == debian-deb-* ]]; then
              suite_arch="${parent#debian-deb-}"
            elif [[ "${parent}" == incoming ]]; then
              echo "Could not tell which suite built ${deb}" >&2
              exit 1
            else
              suite_arch="${parent}"
            fi
            arch="${suite_arch##*-}"
            suite="${suite_arch%-"${arch}"}"
            if [[ -z "${suite}" || "${suite}" == "${suite_arch}" ]]; then
              echo "Could not parse suite and architecture from ${deb}" >&2
              exit 1
            fi
            mkdir -p "debs/${suite}"
            cp -a "${deb}" "debs/${suite}/"
            suites_seen["${suite}"]=1
          done

          for suite in "${!suites_seen[@]}"; do
            aptly repo create -distribution="${suite}" -component=main "et-${suite}"
            aptly repo add "et-${suite}" "debs/${suite}/"*.deb
            aptly publish repo \
              -batch=true \
              -gpg-key="${GPG_KEY_ID}" \
              -passphrase-file="${GPG_PASSPHRASE_FILE}" \
              "et-${suite}"
          done

      - name: Upload published Debian repository
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: debian-repository-${{ env.RELEASE_TAG }}
          path: ~/.aptly/public/

      - name: Configure SSH for Debian repository push
        if: ${{ inputs.push_changes && env.ACT != 'true' }}
        env:
          DEBIAN_REPO_SSH_PRIVATE_KEY: ${{ secrets.DEBIAN_REPO_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "${DEBIAN_REPO_SSH_PRIVATE_KEY}" ]]; then
            echo "Missing required secret DEBIAN_REPO_SSH_PRIVATE_KEY" >&2
            exit 1
          fi

          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${DEBIAN_REPO_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com > "${HOME}/.ssh/known_hosts"
          if [[ ! -s "${HOME}/.ssh/known_hosts" ]]; then
            echo "Failed to populate SSH known_hosts for github.com" >&2
            exit 1
          fi
          chmod 600 "${HOME}/.ssh/known_hosts"
          cat > "${HOME}/.ssh/config" <<EOF
          Host github.com
            HostName github.com
            IdentityFile ${HOME}/.ssh/id_ed25519
            UserKnownHostsFile ${HOME}/.ssh/known_hosts
            StrictHostKeyChecking yes
          EOF
          chmod 600 "${HOME}/.ssh/config"

          echo "GIT_SSH_COMMAND=ssh -F ${HOME}/.ssh/config" >> "${GITHUB_ENV}"

          git config --global user.name "Jason Gauci"
          git config --global user.email "jgmath2000@gmail.com"

      - name: Commit and push Debian repository
        if: ${{ inputs.push_changes && env.ACT != 'true' }}
        run: |
          git clone "${DEBIAN_REPO}" debian-et
          mkdir -p debian-et/debian-source
          rsync -raz --delete ~/.aptly/public/ debian-et/debian-source/
          cp "${GPG_PUBLIC_KEY_FILE}" debian-et/et.gpg

          pushd debian-et
          if git diff --quiet -- debian-source et.gpg; then
            echo "Debian repository is already up to date"
            exit 0
          fi

          git add debian-source et.gpg
          git commit -m "Update Debian packages for ${RELEASE_TAG}"
          git push origin HEAD
          popd
