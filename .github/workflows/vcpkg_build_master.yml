name: Vcpkg Build
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build_vcpkg:
    name: build-vcpkg-${{ matrix.os }}-${{ matrix.gcc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        gcc: [13, 14, 15, 16]
        include:
          - os: windows-latest
            extension: .exe
        exclude:
          #- os: macos-latest # Allow one gcc variant for mac/windows, since they don't use gcc
          #gcc: 11
          - os: macos-latest
            gcc: 14
          - os: macos-latest
            gcc: 15
          - os: macos-latest
            gcc: 16
          #- os: windows-latest
          #gcc: 11
          - os: windows-latest
            gcc: 14
          - os: windows-latest
            gcc: 15
          - os: windows-latest
            gcc: 16
    env:
      # Indicates the CMake build directory where project files and binaries are being produced.
      CMAKE_BUILD_DIR: ${{ github.workspace }}/build
      # Indicates the location of the vcpkg as a Git submodule of the project repository.
      VCPKG_ROOT: ${{ github.workspace }}/external/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite

    steps:
      - name: Install Dependencies (Linux)
        run: |
          sudo apt-get update && \
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                libboost-dev \
                libsodium-dev \
                libprotobuf-dev \
                protobuf-compiler \
                libgflags-dev \
                libutempter-dev \
                build-essential \
                ninja-build \
                libcurl4-openssl-dev \
                curl \
                zip \
                unzip \
                tar \
                cmake \
                libutempter-dev \
                libunwind-dev \
                autoconf \
                autoconf-archive \
                automake
        if: matrix.os == 'ubuntu-latest'
      - name: Install Dependencies (Windows)
        run: choco install -y ninja
        if: matrix.os == 'windows-latest'
      - name: Install Dependencies (macOS)
        run: brew update && brew install ninja cmake automake autoconf autoconf-archive libtool
        if: matrix.os == 'macos-latest'

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up GCC (Ubuntu)
        uses: egor-tensin/setup-gcc@v1
        with:
          version: ${{ matrix.gcc }}
          platform: x64
        if: matrix.os == 'ubuntu-latest'

      # Cache the manifest install tree and vcpkg's binary package cache.
      # Caching the vcpkg submodule tree does not skip port builds: those
      # artifacts live in the CMake build directory and the binary cache.
      - name: Restore vcpkg installed packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.CMAKE_BUILD_DIR }}/vcpkg_installed
            ${{ github.workspace }}/.vcpkg-binary-cache
          key: et-vcpkg-installed-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('.git/modules/external/vcpkg/HEAD') }}-${{ matrix.os }}-${{ matrix.gcc }}

      # VCPKG_DEFAULT_BINARY_CACHE must be an existing directory even on
      # cache miss; vcpkg rejects a missing path before binary sources apply.
      # Use bash so mkdir -p is idempotent on windows-latest too (pwsh mkdir
      # is New-Item and fails when the path already exists after a cache hit).
      - name: Ensure vcpkg binary cache directory
        shell: bash
        run: mkdir -p "${{ github.workspace }}/.vcpkg-binary-cache"

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'
      # Run CMake to generate Ninja project files, using the vcpkg's toolchain file to resolve and install the dependencies as specified in vcpkg.json.
      - name: Install dependencies and generate project files (linux)
        env:
          CC: gcc-${{ matrix.gcc }}
          CXX: g++-${{ matrix.gcc }}
        run: |
          cmake -DDISABLE_TELEMETRY=ON -S "${{ github.workspace }}" -B "${{ env.CMAKE_BUILD_DIR }}" -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo
        if: matrix.os == 'ubuntu-latest'

      - name: Install dependencies and generate project files (mac)
        run: |
          cmake -DDISABLE_TELEMETRY=ON -S "${{ github.workspace }}" -B "${{ env.CMAKE_BUILD_DIR }}" -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo
        if: matrix.os == 'macos-latest'

      - name: Install dependencies and generate project files (windows)
        run: |
          cmake -DDISABLE_TELEMETRY=ON -S "${{ github.workspace }}" -B "${{ env.CMAKE_BUILD_DIR }}" -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo
        if: matrix.os == 'windows-latest'

      # Build the whole project with Ninja (which is spawn by CMake).
      - name: Build
        if: matrix.os != 'windows-latest'
        run: |
          parallel_level="${CI_PARALLEL_LEVEL:-2}"
          if [[ -n "${ACT:-}" ]]; then
            parallel_level="${CI_PARALLEL_LEVEL:-14}"
          fi
          cmake --build "${{ env.CMAKE_BUILD_DIR }}" --parallel "${parallel_level}"
          ctest --test-dir "${{ env.CMAKE_BUILD_DIR }}" --parallel "${parallel_level}" --output-on-failure

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $parallelLevel = if ($env:CI_PARALLEL_LEVEL) { $env:CI_PARALLEL_LEVEL } else { "2" }
          cmake --build "${{ env.CMAKE_BUILD_DIR }}" --parallel "$parallelLevel"
          ctest --test-dir "${{ env.CMAKE_BUILD_DIR }}" --parallel "$parallelLevel" --output-on-failure

      - uses: actions/upload-artifact@v6
        if: ${{ !env.ACT }}
        with:
          name: et-client-${{matrix.os}}-gcc${{matrix.gcc}}
          path: ${{ env.CMAKE_BUILD_DIR }}/et${{matrix.extension}}
