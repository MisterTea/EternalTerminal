name: ccache
description: Restore a per-compiler ccache and point later steps at it
inputs:
  key:
    description: Stable prefix for this compiler, OS, and build flavor
    required: true
  max-size:
    description: Maximum ccache size
    required: false
    default: 500M
runs:
  using: composite
  steps:
    - name: Restore ccache
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/.ccache
        # A new key per commit lets the saved cache include this run's objects.
        # restore-keys loads the newest cache for the same compiler.
        key: ccache-${{ inputs.key }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ inputs.key }}-
    - name: Export ccache environment
      shell: bash
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/.ccache"
        {
          echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache"
          echo "CCACHE_MAXSIZE=${{ inputs.max-size }}"
          echo "CCACHE_COMPRESS=true"
          echo "CCACHE_COMPILERCHECK=content"
        } >> "$GITHUB_ENV"
        if command -v ccache >/dev/null 2>&1; then
          ccache --zero-stats || true
        fi
